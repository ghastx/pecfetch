# Password delle caselle. Copiare in /etc/pecfetch/secrets.toml.
#
#   chown root:pecfetch /etc/pecfetch/secrets.toml
#   chmod 640 /etc/pecfetch/secrets.toml
#
# La chiave è l'id della casella (oppure il suo password_ref).
# Questo file non deve MAI finire nel repository: .gitignore lo esclude già.

[passwords]
rossi = "password-della-casella-rossi"
bianchi = "password-della-casella-bianchi"
