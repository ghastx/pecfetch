# ---------------------------------------------------------------------------
# pecfetch - configurazione di esempio
#
# Copiare in /etc/pecfetch/pecfetch.toml e adattare.
# Questo file NON contiene password: quelle stanno in un file separato o in
# variabili d'ambiente (vedi in fondo).
# ---------------------------------------------------------------------------

[general]
# Radice dei dati prodotti, letta dal componente a valle.
output_root = "/srv/pec/dati"

# Stato locale di pecfetch: cursori UID, deduplica, diario delle esecuzioni.
state_dir = "/var/lib/pecfetch"

# File con le password, permessi 600, fuori dal repository.
secrets_file = "/etc/pecfetch/secrets.toml"

# Elenco delle caselle in un file separato (comodo con 50 caselle).
# Se assente, le caselle si dichiarano qui sotto con [[accounts]].
accounts_file = "caselle.example.toml"

# Fuso orario di TUTTE le date esposte: indice, metadati, archivio, stato e
# timestamp del log, oltre ai nomi dei file d'indice e delle cartelle. Una
# convenzione sola, dichiarata nel CONTRATTO.md scritto in output_root. Va bene
# anche "UTC", purché resti uniforme; un fuso inesistente è un errore fatale.
timezone = "Europe/Rome"

# Sotto questa soglia di spazio libero pecfetch non comincia a scrivere un
# messaggio: rifiuta, annota nello stato e lascia il cursore dov'è, così alla
# prossima esecuzione (liberato lo spazio) riprende da lì. I limiti sugli
# allegati proteggono dal singolo file patologico, questo dall'accumulo di una
# coda che nessuno svuota. Vale sia per output_root sia per state_dir: un disco
# pieno blocca anche le scritture di stato, che sono quelle che non possono
# fallire.
min_free_bytes = 1073741824   # 1 GiB


[fetch]
# Primo avvio prudente: quanti giorni indietro guardare la prima volta.
# Per l'archivio storico serve un comando esplicito: `pecfetch backfill`.
initial_lookback_days = 7

# Quando la UIDVALIDITY cambia (il gestore ha ricreato la casella) si
# risincronizza per data, tornando indietro di questo margine.
resync_overlap_days = 2

# Tetto per esecuzione, per casella. Quello che avanza viene preso dopo.
max_messages_per_run = 500

# Buste più grandi di così non vengono scaricate: vengono registrate come
# errore nel riepilogo e il cursore avanza per non bloccare la casella.
max_message_bytes = 52428800   # 50 MiB

# Timeout IMAP e tentativi di riconnessione per casella.
timeout = 60
connect_retries = 2


[body]
# Oltre questa soglia il corpo viene troncato in corpo.txt (e dichiarato
# nell'indice). Il testo integrale resta sempre in busta.eml.
max_chars = 200000


[attachments]
# Allegati più grandi di così non vengono salvati, ma restano censiti
# nell'indice e nei metadati.
max_store_bytes = 52428800     # 50 MiB
# Allegati più grandi di così vengono salvati ma non se ne estrae il testo.
max_extract_bytes = 26214400   # 25 MiB

# Eseguibili, script, collegamenti e immagini disco non vengono mai scritti in
# output: restano censiti nei metadati e integri dentro busta.eml. Vale sia per
# gli allegati diretti sia per quelli dentro un archivio.
block_active_types = true
# Estensioni da trattare come attive oltre a quelle già previste.
active_types_extra = []


[extraction]
enabled = true
# Ripiego OCR quando l'estrazione diretta da un PDF torna vuota (atti scansionati).
ocr = true
ocr_lang = "ita"
ocr_max_pages = 20
ocr_dpi = 300
ocr_timeout = 300
# Sbustamento delle firme digitali CAdES (.p7m): senza, il testo degli atti
# firmati non si estrae.
p7m_unwrap = true
timeout = 120
max_text_chars = 400000


[extraction.archive]
# Apertura degli allegati compressi. Le voci vengono lette in memoria con nomi
# generati da pecfetch: il percorso dichiarato dentro l'archivio non viene mai
# usato come percorso su disco. rar, 7z e le immagini disco non si aprono.
enabled = true
# Rapporto massimo fra byte espansi e dimensione dell'archivio ricevuto.
max_ratio = 120
# Totale espanso oltre il quale la lettura si ferma (annotandolo).
max_total_bytes = 67108864     # 64 MiB
# Numero massimo di voci, contate su tutto l'albero, non per livello.
max_entries = 500
# Profondità massima di annidamento (vale anche per p7m dentro archivi).
max_depth = 3
# Dimensione massima della singola voce.
max_member_bytes = 33554432    # 32 MiB


[permissions]
# Permessi dell'albero prodotto. Sono una decisione di esercizio: vedi il README.
# Modi in ottale, fra virgolette (in TOML un intero non si scrive in base 8).
#
#   dir_mode / file_mode  l'albero in generale. 0750/0640 significa: il gruppo
#                         legge, gli altri no. L'archivio PEC di uno studio non
#                         è leggibile da chiunque abbia un account sulla VM.
#   shared_dir_mode       coda/ ed esiti/, le uniche due cartelle in cui il
#                         consumatore scrive: 2770 = scrittura al gruppo più
#                         setgid, perché per spostare fuori dalla coda una
#                         cartella lavorata serve il permesso sulla directory
#                         che la contiene, e il setgid tiene nel gruppo giusto
#                         ciò che il consumatore crea.
#   group                 gruppo da assegnare ai file prodotti. Vuoto = quello
#                         del processo (con l'unit systemd fornita, "pecfetch").
#
# Chi espone questa radice in sola lettura sulla rete lo fa con un servizio che
# appartiene al gruppo: si concede l'accesso a un servizio, non a tutti. Per
# aprire invece a chiunque legga la macchina: "0755" / "0644" / "2775".
dir_mode = "0750"
file_mode = "0640"
shared_dir_mode = "2770"
group = ""


[archive]
# Archivio storico interrogabile (SQLite + ricerca full-text).
# Vuoto = <state_dir>/archivio.sqlite3.
path = ""


[logging]
level = "INFO"
file = "/var/log/pecfetch/pecfetch.log"


# ---------------------------------------------------------------------------
# Le caselle possono stare qui invece che in accounts_file.
# La password si indica in uno di questi tre modi:
#   password_env  = "PECFETCH_PW_ROSSI"   variabile d'ambiente
#   password_file = "/etc/pecfetch/pw/rossi"  file con permessi 600
#   password_ref  = "rossi"               voce [passwords] nel file dei segreti
# In assenza di indicazioni si cerca in [passwords] una voce con l'id casella.
# ---------------------------------------------------------------------------

# [[accounts]]
# id = "rossi"                     # identificatore breve, entra nei nomi file
# label = "Rossi S.r.l."           # etichetta leggibile per il consumatore
# client_id = "ROSSI"              # codice cliente dello studio
# address = "rossi@pec.it"
# host = "imaps.pec.aruba.it"
# port = 993
# username = "rossi@pec.it"        # se diverso dall'indirizzo
# folder = "INBOX"
# password_env = "PECFETCH_PW_ROSSI"
# enabled = true
